# CI for the ariadne-thread pnpm monorepo.
#
# Build runs first and the other jobs depend on it: the CLI's type-check and
# tests resolve `@ariadne-thread/core` from its built `dist`, so core must be
# built before they run. `pnpm -r build` builds in topological order, so core
# is built before the cli.

variables:
  # Trust the runner's system CA store in addition to Node's bundled CAs, so
  # `pnpm install` works on runners behind the TLS-inspecting proxies. Additive and
  # harmless on runners that reach the public registry. Requires Node >= 22.15.
  NODE_OPTIONS: --use-system-ca

default:
  image: node:24
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.5.2 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

# Run on merge requests and on branch pushes, but not twice for the same commit.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - build
  - verify

build:
  stage: build
  script:
    - pnpm build
  artifacts:
    paths:
      - "packages/*/dist"
    expire_in: 1 week

lint:
  stage: verify
  needs: [] # Biome lints source; no build artifacts required.
  script:
    - pnpm lint
    - pnpm format:check

typecheck:
  stage: verify
  needs: ["build"]
  script:
    - pnpm typecheck

test:
  stage: verify
  needs: ["build"]
  # Guard the supported Node floor (engines: ">=22") and the dev version.
  image: node:${NODE_VERSION}
  parallel:
    matrix:
      - NODE_VERSION: ["22", "24"]
  script:
    - pnpm test

package-checks:
  stage: verify
  needs: ["build"]
  script:
    - pnpm check:pkg
