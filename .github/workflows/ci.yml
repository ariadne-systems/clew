# CI for the ariadne-thread pnpm monorepo. Migrated from .gitlab-ci.yml.
#
# Build runs first and the other jobs depend on it: `@ariadne-thread/clew`
# resolves `@ariadne-thread/trace` from its built `dist`, so trace must be built
# before clew's type-check and tests run. `pnpm -r build` builds in topological
# order (trace before clew). Downstream jobs download the `dist` artifact instead
# of rebuilding.
name: CI

# GitLab ran on merge-request events and on branch pushes, but never twice for
# the same commit. The idiomatic GitHub equivalent: run on every pull request
# and on pushes to main. Feature branches receive CI once a PR is open (no
# duplicate push + pull_request runs for the same commit).
on:
  push:
    branches: [main]
  pull_request:

# Trust the runner's system CA store in addition to Node's bundled CAs, so
# `pnpm install` works behind TLS-inspecting proxies. Additive and harmless on
# runners that reach the public registry directly. Requires Node >= 22.15.
env:
  NODE_OPTIONS: --use-system-ca

# Cancel superseded runs (GitLab `interruptible: true`), but never cancel main —
# the release job must run to completion (GitLab `interruptible: false`).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
          retention-days: 7

  lint:
    # Static checks — Biome plus reference integrity; no build artifacts required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      # Every relative markdown link and @import in the spec corpus must resolve —
      # the prose-layer rot the type-checker can't see (e.g. a renamed spec's links).
      - run: pnpm check:refs

  typecheck:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages
      - run: pnpm typecheck

  test:
    needs: build
    runs-on: ubuntu-latest
    # Guard the supported Node floor (engines: ">=22") and the dev version.
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages
      - run: pnpm test

  package-checks:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages
      - run: pnpm check:pkg

  # Publish changed packages to npm and push their git tags, on main only.
  # Versions are bumped locally with `pnpm changeset:version` and committed; when
  # that lands on main this job runs `changeset publish` (publishes only the
  # versions not already on the registry — a no-op on commits that bumped nothing)
  # and creates one git tag per published package, which it then pushes back.
  # `needs` lists the whole verify stage, so it waits for it to pass first.
  #
  # Packages publish PUBLICLY (access `public`, per the changeset config and each
  # package's `publishConfig`) to npmjs.org, under the `@ariadne-thread` scope,
  # which need not match the GitHub owner. This needs an automation `NPM_TOKEN`
  # repo secret with publish rights to the scope. Tag pushes use the checkout's
  # GITHUB_TOKEN credentials, which require `contents: write`.
  release:
    needs: [lint, typecheck, test, package-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push git tags
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Configure npm auth for npmjs.org
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish and tag
        run: |
          git config user.email "release-bot@ariadne-thread"
          git config user.name "ariadne release"
          pnpm release
          git push origin --tags
