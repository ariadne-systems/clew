pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,js,json,jsonc}"
      run: pnpm biome check --no-errors-on-unmatched --staged
    typecheck:
      run: pnpm typecheck
    check:
      run: pnpm check:specs
    # Run only the tests affected by the staged files (vitest `related` walks the
    # module graph); passes when a staged file has no related tests.
    test:
      glob: "*.ts"
      run: pnpm exec vitest related --run --passWithNoTests {staged_files}
