# Document schema for specs (the `spec` document type: SW, CON,
# ARCH, NF, STK, SYS, ENT). clew merges this with the pinned core (id form, `**Status**`
# grammar, relation links) it always enforces. The `Status` value set is clew's; it is
# listed here so the schema is complete, and a restated enum must match clew's set
# exactly; `Lens` carries only the allowed values.
# Fields are listed in the order a spec must present them; a `**Bold label**` the
# schema does not list (the `## Relations` sub-labels) may appear anywhere after them.
onError: fail
fields:
  Title:
    required: true
  Lens:
    required: true
    enum: [STK, SYS, SW, ARCH, NF, CON, ENT]
  Status:
    enum: [planned, active, deprecated]
  Description:
    required: true
  Rationale:
    required: true
  Verification Description:
    required: true
